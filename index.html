<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Stark Industries HUD</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02050b;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 6px;
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.6);
        }

        /* Efeito de scanline futurista */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            z-index: 99;
            background-size: 100% 3px;
            pointer-events: none;
        }

        /* Topo Stark Industries */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 240, 255, 0.7);
            padding-bottom: 4px;
            font-size: 10px;
            background: rgba(0, 240, 255, 0.05);
        }
        .brand { font-weight: bold; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px #00f0ff; }
        .jarvis-tag { background: rgba(0,240,255,0.25); padding: 2px 8px; border: 1px solid #00f0ff; letter-spacing: 2px; font-weight: bold; color: #fff; box-shadow: 0 0 8px #00f0ff; }

        /* Grid Principal */
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 6px;
            flex: 1;
            margin: 6px 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid rgba(0, 240, 255, 0.5);
            background: radial-gradient(circle, rgba(0,240,255,0.06) 0%, rgba(0,0,0,0.9) 100%);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 9px;
            position: relative;
        }

        .panel-title {
            border-bottom: 1px solid rgba(0,240,255,0.5);
            padding-bottom: 3px;
            margin-bottom: 4px;
            color: #58a6ff;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 10px;
        }

        /* Barras de Status Dinâmicas */
        .stat-group { margin-bottom: 4px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 8px; color: #8ab4f8; margin-bottom: 1px; font-weight: bold; }
        .bar-container { width: 100%; height: 6px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.5); }
        .bar-fill { height: 100%; background: #00f0ff; box-shadow: 0 0 6px #00f0ff; transition: width 0.8s ease; }

        /* Dados de Sistema */
        .data-stream {
            font-size: 8px;
            color: #a5d6ff;
            line-height: 1.3;
            border-left: 2px solid #00f0ff;
            padding-left: 4px;
            background: rgba(0,240,255,0.02);
            padding-top: 2px;
            padding-bottom: 2px;
        }

        /* Centro: Reator Arc e Input de Comando */
        .center-hub {
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }
        .jarvis-main-name {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 12px #00f0ff;
        }

        .arc-reactor {
            width: 60px;
            height: 60px;
            border: 3px dashed rgba(0, 240, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.8);
            animation: spin-core 10s linear infinite;
            margin: auto;
        }
        .arc-core-inner {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle, #fff 0%, #00f0ff 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }
        @keyframes spin-core { 100% { transform: rotate(360deg); } }

        /* Caixa de Comando (Teclado Abre Aqui) */
        .command-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .jarvis-input {
            width: 100%;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0,240,255,0.4);
        }
        .jarvis-input::placeholder { color: rgba(0, 240, 255, 0.4); }

        /* Radar Tático */
        .radar-box {
            width: 65px;
            height: 65px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            align-self: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, rgba(0,240,255,0.12) 0%, transparent 70%);
            box-shadow: inset 0 0 10px rgba(0,240,255,0.6);
            margin: 2px 0;
        }
        .radar-box::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 50%; height: 2px;
            background: #00f0ff;
            transform-origin: left center;
            animation: sweep 3s linear infinite;
        }
        @keyframes sweep { 100% { transform: rotate(360deg); } }

        /* Rodapé Tecnológico */
        .hud-footer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 2px solid rgba(0, 240, 255, 0.6);
            padding-top: 4px;
            font-size: 8px;
            text-align: center;
            background: rgba(0, 240, 255, 0.05);
            font-weight: bold;
        }
        .highlight { color: #fff; font-size: 9px; }
    </style>
</head>
<body>

    <div class="hud-top">
        <span class="brand">STARK INDUSTRIES // OS v10.1</span>
        <span class="jarvis-tag">J.A.R.V.I.S.</span>
        <span id="clock" style="color: #00f0ff; font-weight: bold;">--:--:--</span>
    </div>

    <div class="hud-grid">
        <!-- Painel Esquerdo -->
        <div class="panel">
            <div>
                <div class="panel-title">SYSTEM DIAGNOSTICS</div>
                <div class="stat-group">
                    <div class="stat-label"><span>CPU CORE</span><span id="cpu-val">42%</span></div>
                    <div class="bar-container"><div class="bar-fill" id="cpu-bar" style="width: 42%;"></div></div>
                </div>
                <div class="stat-group">
                    <div class="stat-label"><span>MEMORY RAM</span><span id="ram-val">58%</span></div>
                    <div class="bar-container"><div class="bar-fill" id="ram-bar" style="width: 58%;"></div></div>
                </div>
                <div class="stat-group">
                    <div class="stat-label"><span>QUANTUM SWAP</span><span id="swap-val">24%</span></div>
                    <div class="bar-container"><div class="bar-fill" id="swap-bar" style="width: 24%;"></div></div>
                </div>
            </div>
            <div class="data-stream">
                [CORE]: STARK OS ACTIVE<br>
                [INPUT]: KEYBOARD READY
            </div>
        </div>

        <!-- Painel Central: JARVIS, Reator e Input de Digitação -->
        <div class="panel center-hub">
            <div class="jarvis-main-name">J.A.R.V.I.S.</div>
            
            <div class="arc-reactor">
                <div class="arc-core-inner"></div>
            </div>

            <div class="command-box">
                <input type="text" class="jarvis-input" id="userInput" placeholder="DIGITE UM COMANDO..." autocomplete="off">
            </div>
        </div>

        <!-- Painel Direito -->
        <div class="panel" style="align-items: center;">
            <div class="panel-title" style="width: 100%;">TACTICAL MONITOR</div>
            <div style="font-size: 14px; font-weight: bold; color: #fff; margin-top: 2px;" id="temp-display">--°C</div>
            <div style="font-size: 8px; color: #58a6ff; font-weight: bold;" id="loc-display">GPS SYNC</div>
            
            <div class="radar-box"></div>

            <div style="width: 100%; font-size: 8px; border-top: 1px dotted rgba(0,240,255,0.5); padding-top: 2px; text-align: left;">
                NET: <span style="color:#fff; font-weight:bold;" id="net-speed">94 Mbps</span><br>
                STATUS: <span style="color:#238636; font-weight:bold;">SECURE</span>
            </div>
        </div>
    </div>

    <div class="hud-footer">
        <div>CORE: <span class="highlight">STABLE</span></div>
        <div>EFFICIENCY: <span class="highlight" id="eff-val">99.8%</span></div>
        <div>LINK: <span class="highlight">OPTIMAL</span></div>
        <div>MISSION: <span class="highlight">NOMINAL</span></div>
    </div>

    <script>
        // Relógio em tempo real
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Estatísticas oscilando
        setInterval(() => {
            const cpu = Math.floor(Math.random() * 35) + 30;
            const ram = Math.floor(Math.random() * 20) + 45;
            const swap = Math.floor(Math.random() * 15) + 15;
            const net = Math.floor(Math.random() * 40) + 70;
            const eff = (99.0 + Math.random() * 0.9).toFixed(1) + '%';

            document.getElementById('cpu-val').innerText = cpu + '%';
            document.getElementById('cpu-bar').style.width = cpu + '%';
            document.getElementById('ram-val').innerText = ram + '%';
            document.getElementById('ram-bar').style.width = ram + '%';
            document.getElementById('swap-val').innerText = swap + '%';
            document.getElementById('swap-bar').style.width = swap + '%';
            document.getElementById('net-speed').innerText = net + ' Mbps';
            document.getElementById('eff-val').innerText = eff;
        }, 2000);

        // Clima via Geolocation API
        async function buscarClimaLocal() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await res.json();
                        if(data && data.current_weather) {
                            document.getElementById('temp-display').innerText = Math.round(data.current_weather.temperature) + '°C';
                            document.getElementById('loc-display').innerText = "GPS CONNECTED";
                        }
                    } catch(e) {
                        document.getElementById('temp-display').innerText = '28°C';
                    }
                }, () => {
                    document.getElementById('temp-display').innerText = '27°C';
                });
            }
        }
        buscarClimaLocal();
    </script>
</body>
</html>
